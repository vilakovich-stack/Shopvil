<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopVil - Pallamano Aretusa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap');
        body { font-family: 'Montserrat', sans-serif; }
        .bg-aretusa-red { background-color: #c8102e; }
        .text-aretusa-red { color: #c8102e; }
        .bg-aretusa-green { background-color: #006747; }
        .text-aretusa-green { color: #006747; }
        
        .file-upload { position: relative; display: inline-block; width: 100%; }
        .file-upload__input { position: absolute; left: 0; top: 0; right: 0; bottom: 0; font-size: 1; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        
        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 100; }
        .toast { background-color: #333; color: white; padding: 12px 24px; border-radius: 8px; margin-top: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; align-items: center; animation: slideIn 0.3s, fadeOut 0.5s 2.5s forwards; }
        .toast i { margin-right: 10px; }
        .toast.success { background-color: #006747; }
        .toast.error { background-color: #c8102e; }
        
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
    </style>
</head>
<body class="bg-gray-50">

    <nav class="bg-white shadow-md fixed w-full z-10 top-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex-shrink-0 flex items-center">
                    <div class="h-10 w-10 rounded-full bg-aretusa-red flex items-center justify-center text-white font-bold mr-2">SV</div>
                    <span class="font-bold text-xl text-gray-800">ShopVil <span class="text-sm font-normal text-gray-500 hidden sm:inline">| Pallamano Aretusa</span></span>
                </div>
                <div class="relative cursor-pointer" onclick="toggleCart()">
                    <i class="fas fa-shopping-cart text-2xl text-gray-600 hover:text-aretusa-red transition"></i>
                    <span id="cart-count" class="absolute -top-2 -right-2 bg-aretusa-red text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center border-2 border-white">0</span>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-24 pb-12">
        <div class="mb-8">
            <div class="border-b border-gray-200">
                <nav class="-mb-px flex space-x-8" aria-label="Tabs">
                    <button id="tab-aretusa-btn" onclick="switchTab('aretusa')" class="tab-btn border-aretusa-red text-aretusa-red whitespace-nowrap py-4 px-1 border-b-2 font-bold text-lg flex items-center">
                        <i class="fas fa-tshirt mr-2"></i> Prodotti Ufficiali
                    </button>
                    <button id="tab-hummel-btn" onclick="switchTab('hummel')" class="tab-btn border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 whitespace-nowrap py-4 px-1 border-b-2 font-medium text-lg flex items-center">
                        <i class="fas fa-clipboard-list mr-2"></i> Ordine Hummel
                    </button>
                </nav>
            </div>
        </div>

        <section id="tab-aretusa-content" class="tab-content">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">Collezione Pallamano Aretusa</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8" id="product-grid"></div>
        </section>

        <section id="tab-hummel-content" class="tab-content hidden">
            <div class="bg-white rounded-2xl shadow-xl overflow-hidden md:flex">
                <div class="md:w-1/2 bg-gray-100 flex items-center justify-center p-8 relative min-h-[300px] md:min-h-[500px]">
                    <div id="hummel-image-placeholder" class="text-center transition-opacity duration-300 opacity-100 absolute inset-0 flex flex-col items-center justify-center p-6">
                        <i class="fas fa-camera text-6xl text-gray-300 mb-4"></i>
                        <p class="text-gray-500 font-medium">Carica qui la foto dal catalogo Hummel</p>
                        <p class="text-gray-400 text-sm mt-2">La tua immagine apparirà qui.</p>
                    </div>
                    <img id="hummel-image-preview" src="" alt="Anteprima" class="max-w-full max-h-full object-contain transition-opacity duration-300 opacity-0 z-10 relative shadow-sm hidden mix-blend-multiply">
                </div>

                <div class="md:w-1/2 p-8 lg:p-12 flex flex-col justify-center bg-white">
                    <div class="mb-8">
                        <h2 class="text-3xl font-extrabold text-gray-900 leading-tight mb-2">Nuovo Articolo Hummel</h2>
                        <p class="text-gray-600">Configura il prodotto che hai visto sul catalogo ufficiale.</p>
                    </div>

                    <form id="hummel-order-form" class="space-y-6">
                        <div>
                            <input type="text" id="hummel-name" class="block w-full border-0 border-b-2 border-gray-200 focus:ring-0 focus:border-aretusa-red text-xl font-bold placeholder-gray-300 py-2 px-0 transition-colors" placeholder="Es. Felpa Core Poly">
                        </div>
                        <div class="grid grid-cols-2 gap-6">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Numero di Referenza (SKU)</label>
                                <div class="relative rounded-md shadow-sm">
                                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i class="fas fa-barcode text-gray-400"></i></div>
                                    <input type="text" id="hummel-ref" class="block w-full pl-10 pr-3 py-3 border border-gray-200 rounded-lg bg-gray-50 placeholder-gray-400" placeholder="Es. 203456-2001">
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Taglia</label>
                                <select id="hummel-size" class="block w-full pl-3 pr-10 py-3 border border-gray-200 rounded-lg bg-white">
                                    <option value="">Seleziona</option><option value="XS">XS</option><option value="S">S</option><option value="M">M</option><option value="L">L</option><option value="XL">XL</option><option value="XXL">XXL</option><option value="TU">Taglia Unica</option>
                                </select>
                            </div>
                        </div>

                        <div class="file-upload w-full">
                            <button type="button" class="w-full bg-white border-2 border-dashed border-gray-300 text-gray-600 py-4 px-4 rounded-xl font-bold hover:border-aretusa-green hover:text-aretusa-green transition-all group flex items-center justify-center">
                                <i class="fas fa-cloud-upload-alt mr-3 text-xl group-hover:scale-110 transition-transform"></i> Scegli la Foto...
                            </button>
                            <input type="file" id="hummel-photo" accept="image/*" class="file-upload__input" onchange="previewHummelImage(this)">
                        </div>

                        <button type="button" onclick="addHummelToCart()" class="w-full flex justify-center items-center py-4 px-6 rounded-xl shadow-md text-lg font-bold text-white bg-aretusa-green hover:bg-green-700 mt-8">
                            <i class="fas fa-cart-plus mr-3"></i> Aggiungi al Carrello
                        </button>
                    </form>
                </div>
            </div>
        </section>

    </main>

    <!-- Carrito Lateral -->
    <div id="cart-sidebar" class="fixed inset-y-0 right-0 w-full sm:w-96 bg-white shadow-2xl transform translate-x-full transition-transform duration-300 ease-in-out z-30 flex flex-col">
        <div class="px-6 py-4 bg-gray-50 border-b border-gray-200 flex justify-between items-center">
            <h2 class="text-xl font-bold text-gray-800"><i class="fas fa-shopping-cart mr-2"></i>Il tuo Carrello</h2>
            <button onclick="toggleCart()" class="text-gray-500 hover:text-gray-800 transition"><i class="fas fa-times text-xl"></i></button>
        </div>
        <div class="flex-1 overflow-y-auto p-6 space-y-6" id="cart-items"></div>
        <div class="px-6 py-4 bg-gray-50 border-t border-gray-200">
             <div class="mb-4 space-y-3">
                <h3 class="font-bold text-gray-700 mb-2">I tuoi Dati (Obbligatori)</h3>
                <input type="text" id="customer-name" placeholder="Nome e Cognome *" class="w-full p-2 border border-gray-300 rounded-md text-sm">
                <input type="email" id="customer-email" placeholder="Email (per ricevere la ricevuta) *" class="w-full p-2 border border-gray-300 rounded-md text-sm">
                <input type="tel" id="customer-phone" placeholder="Telefono *" class="w-full p-2 border border-gray-300 rounded-md text-sm">
                <select id="customer-team" class="w-full p-2 border border-gray-300 rounded-md text-sm bg-white">
                    <option value="">Categoria/Squadra *</option><option value="Senior Maschile">Senior Maschile</option><option value="Senior Femminile">Senior Femminile</option><option value="U17">Under 17</option><option value="U15">Under 15</option><option value="U13">Under 13</option><option value="Altro">Altro / Tifoso</option>
                </select>
            </div>

            <div class="flex justify-between items-center mb-4">
                <span class="font-bold text-lg text-gray-700">Totale Stimato:</span>
                <span id="cart-total" class="font-bold text-2xl text-aretusa-red">€0.00</span>
            </div>
            
            <button id="send-order-btn" onclick="sendOrderGoogle()" class="w-full bg-blue-600 text-white py-3 px-4 rounded-xl hover:bg-blue-700 transition font-bold flex items-center justify-center shadow-md">
                <i class="fas fa-paper-plane mr-2 text-xl"></i> Invia Ordine
            </button>
        </div>
    </div>
    <div id="cart-overlay" class="fixed inset-0 bg-black bg-opacity-50 hidden z-20" onclick="toggleCart()"></div>

    <div id="toast-container"></div>

    <script>
        const standardSizes = ["XS", "S", "M", "L", "XL", "XXL", "3XL"];
        
        const products = [
            { id: 1, name: "Maglia di gioco", price: 31.90, image: "MAGLIA DI GIOCO.jpg", sizes: standardSizes, colors: ["Rossa", "Nera"], needsName: true, needsNumber: true },
            { id: 2, name: "Pantaloncini di gioco", price: 27.50, image: "Pantaloncini gioco.jpg", sizes: standardSizes, colors: [], needsName: false, needsNumber: true },
            { id: 3, name: "Maglia di gioco Portiere", price: 40.90, image: "Maglia portiere gioco.jpg", sizes: standardSizes, colors: ["Rosa", "Nera", "Azzurra"], needsName: true, needsNumber: true },
            { id: 4, name: "Pantalone di gioco portiere", price: 41.00, image: "Pantalone portiere.jpg", sizes: standardSizes, colors: [], needsName: false, needsNumber: true },
            { id: 5, name: "Zaino", price: 23.50, image: "Zaino.jpg", sizes: [], colors: [], needsName: false, needsNumber: false },
            { id: 6, name: "Bermuda", price: 24.50, image: "Bermudas.jpg", sizes: standardSizes, colors: [], needsName: false, needsNumber: false },
            { id: 7, name: "Giubbotto", price: 48.00, image: "Bench jacket.jpg", sizes: standardSizes, colors: [], needsName: false, needsNumber: false },
            { id: 8, name: "Tuta", price: 48.00, image: "Tracksuit.png", sizes: standardSizes, colors: [], needsName: false, needsNumber: false },
            { id: 9, name: "Polo", price: 24.50, image: "Polo.jpg", sizes: standardSizes, colors: ["Nera", "Verde", "Rossa"], needsName: false, needsNumber: false }
        ];

        let cart = JSON.parse(localStorage.getItem('shopvilCart')) || [];

        function showToast(message, type = 'success') {
            const toastContainer = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i><span>${message}</span>`;
            toastContainer.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        document.addEventListener('DOMContentLoaded', () => { renderProducts(); updateCartUI(); });

        function renderProducts() {
            const grid = document.getElementById('product-grid');
            if (products.length === 0) { grid.innerHTML = '<p class="col-span-full text-center text-gray-500 py-8">Nessun prodotto.</p>'; return; }
            grid.innerHTML = '';
            
            products.forEach(p => {
                let sizeHtml = '';
                if(p.sizes && p.sizes.length > 0) {
                    sizeHtml = `<select id="size-${p.id}" class="border border-gray-300 rounded p-1 text-sm ml-2 font-medium bg-gray-50 outline-none focus:border-aretusa-red">
                        ${p.sizes.map(s => `<option value="${s}">${s}</option>`).join('')}
                    </select>`;
                }

                let colorHtml = '';
                if(p.colors && p.colors.length > 0) {
                    colorHtml = `
                    <div class="mt-2 flex items-center justify-between">
                        <span class="text-xs font-bold text-gray-500 uppercase">Colore:</span>
                        <select id="color-${p.id}" class="border border-gray-300 rounded p-1 text-sm font-medium bg-gray-50 outline-none focus:border-aretusa-red w-32">
                            ${p.colors.map(c => `<option value="${c}">${c}</option>`).join('')}
                        </select>
                    </div>`;
                }

                let customizationHtml = '';
                if(p.needsName || p.needsNumber) {
                    customizationHtml = `<div class="mt-3 mb-2 p-3 bg-gray-50 rounded-lg border border-gray-200">
                        <p class="text-[10px] font-bold text-gray-500 mb-2 uppercase tracking-wider"><i class="fas fa-pen mr-1"></i> Personalizzazione</p>`;
                    
                    if (p.needsName) customizationHtml += `<input type="text" id="custom-name-${p.id}" placeholder="Nome (es. ROSSI)" class="w-full mb-2 p-2 text-sm border border-gray-300 rounded outline-none focus:border-aretusa-red uppercase transition">`;
                    if (p.needsNumber) customizationHtml += `<input type="number" id="custom-number-${p.id}" placeholder="Numero (es. 10)" class="w-full p-2 text-sm border border-gray-300 rounded outline-none focus:border-aretusa-red transition" min="0" max="99">`;
                    customizationHtml += `</div>`;
                }

                grid.innerHTML += `
                    <div class="bg-white rounded-xl shadow-md overflow-hidden group flex flex-col border border-gray-100">
                        <div class="bg-gray-100 flex items-center justify-center h-64 p-4 overflow-hidden">
                            <img src="${p.image}" alt="${p.name}" class="max-w-full max-h-full object-contain mix-blend-multiply transition duration-300 group-hover:scale-105" onerror="this.onerror=null; this.src='https://via.placeholder.com/300x300/e5e7eb/a3a3a3?text=Foto+Non+Trovata';">
                        </div>
                        <div class="p-6 flex flex-col flex-grow">
                            <h3 class="font-bold text-xl mb-2 text-gray-800">${p.name}</h3>
                            <div class="flex items-center justify-between mb-1">
                                <span class="text-2xl font-bold text-aretusa-red">€${p.price.toFixed(2)}</span>
                                ${sizeHtml}
                            </div>
                            ${colorHtml}
                            ${customizationHtml}
                            <div class="mt-auto pt-4">
                                <button onclick="addToCart(${p.id})" class="w-full bg-aretusa-red text-white py-3 px-4 rounded-xl font-bold hover:bg-red-700 transition shadow-sm active:scale-95">
                                    Aggiungi al Carrello
                                </button>
                            </div>
                        </div>
                    </div>`;
            });
        }

        function switchTab(tab) {
            document.getElementById('tab-aretusa-content').classList.toggle('hidden', tab !== 'aretusa');
            document.getElementById('tab-hummel-content').classList.toggle('hidden', tab !== 'hummel');
        }
        
        function previewHummelImage(input) {
            const preview = document.getElementById('hummel-image-preview');
            const ph = document.getElementById('hummel-image-placeholder');
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) { 
                    preview.src = e.target.result; 
                    preview.classList.remove('hidden', 'opacity-0'); 
                    preview.classList.add('opacity-100'); 
                    ph.classList.add('opacity-0', 'hidden'); 
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function toggleCart() {
            document.getElementById('cart-sidebar').classList.toggle('translate-x-full');
            document.getElementById('cart-overlay').classList.toggle('hidden');
        }

        function saveCart() { localStorage.setItem('shopvilCart', JSON.stringify(cart)); }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const size = document.getElementById(`size-${id}`) ? document.getElementById(`size-${id}`).value : 'Unica';
            const color = document.getElementById(`color-${id}`) ? document.getElementById(`color-${id}`).value : '';
            
            let customName = product.needsName ? document.getElementById(`custom-name-${id}`).value.trim().toUpperCase() : '';
            let customNumber = product.needsNumber ? document.getElementById(`custom-number-${id}`).value.trim() : '';

            const uniqueCartId = `a_${id}_${size}_${color}_${customName}_${customNumber}`;

            const item = cart.find(i => i.uniqueCartId === uniqueCartId);
            
            if (item) {
                item.quantity++;
            } else {
                cart.push({ ...product, size, color, quantity: 1, isHummel: false, customName, customNumber, uniqueCartId });
            }
            
            updateCartUI(); saveCart(); showToast(`Aggiunto!`); toggleCart();

            if (product.needsName) document.getElementById(`custom-name-${id}`).value = '';
            if (product.needsNumber) document.getElementById(`custom-number-${id}`).value = '';
        }

        function addHummelToCart() {
            const name = document.getElementById('hummel-name').value.trim();
            const ref = document.getElementById('hummel-ref').value.trim();
            const size = document.getElementById('hummel-size').value;
            const photoInput = document.getElementById('hummel-photo');
            
            if (!name || !ref || !size) return showToast('Compila Nome, Referenza e Taglia.', 'error');

            const processHummelItem = (base64Clean) => {
                cart.push({ 
                    uniqueCartId: 'h_' + Date.now(), 
                    name, price: 0, 
                    image: base64Clean || 'https://via.placeholder.com/100x100?text=Foto+Non+Fornita', 
                    sizes: [size], size, color: '', quantity: 1, isHummel: true, hummelRef: ref, hasRealPhoto: !!base64Clean
                });
                updateCartUI(); saveCart(); showToast('Articolo Hummel aggiunto!'); toggleCart();
                
                document.getElementById('hummel-name').value = ''; document.getElementById('hummel-ref').value = '';
                if(photoInput) photoInput.value = '';
                document.getElementById('hummel-image-preview').classList.add('hidden');
                document.getElementById('hummel-image-placeholder').classList.remove('hidden', 'opacity-0');
            };

            if (photoInput.files && photoInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) { 
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 400;
                        const scaleSize = MAX_WIDTH / img.width;
                        canvas.width = MAX_WIDTH;
                        canvas.height = img.height * scaleSize;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        // GUARDAMOS SÓLO LOS DATOS PUROS DE LA IMAGEN
                        let fullData = canvas.toDataURL('image/jpeg', 0.6);
                        processHummelItem(fullData);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(photoInput.files[0]);
            } else {
                processHummelItem(null);
            }
        }

        function removeFromCart(uniqueCartId) {
            cart = cart.filter(i => i.uniqueCartId !== uniqueCartId);
            updateCartUI(); saveCart(); showToast('Rimosso.');
        }

        function updateQuantity(uniqueCartId, change) {
            const item = cart.find(i => i.uniqueCartId === uniqueCartId);
            if (item) { 
                item.quantity += change; 
                if (item.quantity <= 0) removeFromCart(uniqueCartId); 
                else { updateCartUI(); saveCart(); } 
            }
        }

        function updateCartUI() {
            const container = document.getElementById('cart-items');
            document.getElementById('cart-count').innerText = cart.reduce((t, i) => t + i.quantity, 0);
            if (cart.length === 0) { container.innerHTML = '<p class="text-center text-gray-500 py-8">Carrello vuoto</p>'; document.getElementById('cart-total').innerText = '€0.00'; return; }
            
            let total = 0;
            container.innerHTML = cart.map(i => {
                const iTotal = i.price * i.quantity;
                if (!i.isHummel) total += iTotal;
                
                const pDisplay = i.isHummel ? '<span class="text-xs text-orange-500 bg-orange-50 px-2 py-1 rounded">Da preventivare</span>' : `€${iTotal.toFixed(2)}`;
                
                let detailsHtml = `<span class="font-bold text-gray-700">${i.size}</span>`;
                if(i.color) detailsHtml += ` | Colore: <span class="font-bold text-gray-700">${i.color}</span>`;
                if(i.isHummel) detailsHtml += ` | Ref: ${i.hummelRef}`;

                let customInfoHtml = '';
                if (i.customName || i.customNumber) {
                    customInfoHtml = `<p class="text-[11px] font-bold text-blue-600 mt-1.5 bg-blue-50 inline-block px-2 py-0.5 rounded">`;
                    if(i.customName) customInfoHtml += `Nome: ${i.customName} `;
                    if(i.customNumber) customInfoHtml += `| N°: ${i.customNumber}`;
                    customInfoHtml += `</p>`;
                }

                let imgSrc = i.isHummel && i.hasRealPhoto ? i.image : i.image;

                return `
                    <div class="flex items-start space-x-4 bg-white p-4 rounded-xl border border-gray-100 shadow-sm relative">
                        <img src="${imgSrc}" class="w-16 h-16 object-contain rounded-md border border-gray-200 mix-blend-multiply" onerror="this.onerror=null; this.src='https://via.placeholder.com/100?text=Nessuna';">
                        <div class="flex-1">
                            <h4 class="font-bold text-gray-800 leading-tight line-clamp-1">${i.name}</h4>
                            <p class="text-xs text-gray-500 mt-1">Taglia: ${detailsHtml}</p>
                            ${customInfoHtml}
                            
                            <div class="flex justify-between items-center mt-3">
                                <div class="font-black text-aretusa-red">${pDisplay}</div>
                                <div class="flex items-center bg-gray-50 rounded-lg p-0.5 border border-gray-200">
                                    <button onclick="updateQuantity('${i.uniqueCartId}', -1)" class="text-gray-500 hover:text-red-500 w-7 h-7 flex items-center justify-center transition"><i class="fas fa-minus text-xs"></i></button>
                                    <span class="w-6 text-center font-bold text-sm text-gray-700">${i.quantity}</span>
                                    <button onclick="updateQuantity('${i.uniqueCartId}', 1)" class="text-gray-500 hover:text-green-500 w-7 h-7 flex items-center justify-center transition"><i class="fas fa-plus text-xs"></i></button>
                                </div>
                            </div>
                        </div>
                        <button onclick="removeFromCart('${i.uniqueCartId}')" class="absolute top-2 right-2 text-gray-300 hover:text-red-500 p-2 transition"><i class="fas fa-trash-alt"></i></button>
                    </div>`;
            }).join('');
            document.getElementById('cart-total').innerText = `€${total.toFixed(2)}`;
        }

        async function sendOrderGoogle() {
            // !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
            // AQUI VA LA URL OFICIAL DE TU PROYECTO
            const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbylNZ7WbQ0-WSmVVUb1W4ryxFrTNilT43rVKokE7qXnd3MJdVilW_4JNzXch3wUh-gD/exec"; 
            // !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!

            const customerName = document.getElementById('customer-name').value.trim();
            const customerPhone = document.getElementById('customer-phone').value.trim();
            const customerEmail = document.getElementById('customer-email').value.trim();
            const customerTeam = document.getElementById('customer-team').value;

            if (cart.length === 0) return showToast('Il carrello è vuoto.', 'error');
            if (!customerName || !customerPhone || !customerTeam || !customerEmail) return showToast('Compila tutti i dati.', 'error');
            
            const refPedido = 'ORD-' + Math.floor(100000 + Math.random() * 900000);

            const btn = document.getElementById('send-order-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Invio in corso...';
            btn.disabled = true;

            let pathArray = window.location.pathname.split('/');
            if(pathArray[pathArray.length-1].includes('.html')) pathArray.pop();
            let baseUrl = window.location.origin + pathArray.join('/') + '/';

            let orderSummaryHtml = "";
            let arrInlineImages = [];
            
            cart.forEach((item, index) => {
                let itemTotal = (item.price * item.quantity).toFixed(2);
                
                if(item.isHummel) {
                    let cidName = "hummel_img_" + index;
                    let imgSrc = "https://via.placeholder.com/150?text=Nessuna+Foto";
                    
                    if (item.hasRealPhoto) {
                        imgSrc = "cid:" + cidName;
                        // PREPARAMOS LA FOTO PARA GOOGLE (Mandamos los datos puros)
                        arrInlineImages.push({
                            cid: cidName,
                            data: item.image
                        });
                    }

                    orderSummaryHtml += `
                    <div style="display: flex; margin-bottom: 20px; border-bottom: 1px solid #eaeaea; padding-bottom: 15px;">
                        <img src="${imgSrc}" style="max-width: 100px; max-height: 100px; object-fit: contain; border-radius: 8px; margin-right: 20px; border: 1px solid #ddd;" />
                        <div>
                            <h4 style="margin: 0 0 8px 0; color: #c8102e; font-size: 16px;">🔴 [HUMMEL] ${item.quantity}x ${item.name}</h4>
                            <p style="margin: 0 0 5px 0; font-size: 14px;"><strong>Referenza:</strong> ${item.hummelRef}</p>
                            <p style="margin: 0 0 5px 0; font-size: 14px;"><strong>Taglia:</strong> ${item.size}</p>
                            <p style="margin: 0; font-size: 14px; color: #e67e22;"><strong>Prezzo:</strong> Da preventivare</p>
                        </div>
                    </div>`;
                } else {
                    let fullImageUrl = baseUrl + encodeURIComponent(item.image);
                    let attrExtra = "";
                    if(item.color) attrExtra += ` | Colore: ${item.color}`;

                    orderSummaryHtml += `
                    <div style="display: flex; margin-bottom: 20px; border-bottom: 1px solid #eaeaea; padding-bottom: 15px;">
                        <img src="${fullImageUrl}" style="max-width: 100px; max-height: 100px; object-fit: contain; border-radius: 8px; margin-right: 20px; border: 1px solid #ddd;" />
                        <div>
                            <h4 style="margin: 0 0 8px 0; color: #006747; font-size: 16px;">🟢 [ARETUSA] ${item.quantity}x ${item.name}</h4>
                            <p style="margin: 0 0 5px 0; font-size: 14px;"><strong>Taglia:</strong> ${item.size} ${attrExtra}</p>`;
                    
                    if (item.customName || item.customNumber) {
                        let msg = "";
                        if(item.customName) msg += `Nome [${item.customName}] `;
                        if(item.customNumber) msg += `N° [${item.customNumber}]`;
                        orderSummaryHtml += `<p style="margin: 0 0 5px 0; font-size: 14px; background-color: #eef2ff; padding: 5px; border-radius: 4px; color: #3730a3;"><strong>Personalizzazione:</strong> ${msg}</p>`;
                    }
                    
                    orderSummaryHtml += `
                            <p style="margin: 0; font-size: 14px;"><strong>Subtotale:</strong> €${itemTotal}</p>
                        </div>
                    </div>`;
                }
            });

            orderSummaryHtml += `
            <div style="text-align: right; margin-top: 25px; padding-top: 15px; border-top: 2px solid #c8102e;">
                <h3 style="margin: 0; color: #333;">TOTALE STIMATO (Solo Stock)</h3>
                <h2 style="margin: 5px 0 0 0; color: #c8102e; font-size: 24px;">${document.getElementById('cart-total').innerText}</h2>
            </div>`;

            const formData = new FormData();
            formData.append('nombre', customerName);
            formData.append('telefono', customerPhone);
            formData.append('email', customerEmail);
            formData.append('squadra', customerTeam);
            formData.append('referencia', refPedido);
            formData.append('ordenHtml', orderSummaryHtml);
            
            // Adjuntamos el listado de imágenes para que Google las decodifique
            if (arrInlineImages.length > 0) {
                formData.append('inlineImages', JSON.stringify(arrInlineImages));
            }

            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: "POST",
                    mode: 'no-cors',
                    body: formData
                });

                showToast('Ordine inviato! Controlla la tua email.', 'success');
                cart = []; saveCart(); updateCartUI(); toggleCart();
                document.getElementById('customer-name').value = '';
                document.getElementById('customer-phone').value = '';
                document.getElementById('customer-email').value = '';
                document.getElementById('customer-team').value = '';
                
            } catch(error) {
                console.error(error);
                showToast('Errore di connessione. Riprova.', 'error');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
